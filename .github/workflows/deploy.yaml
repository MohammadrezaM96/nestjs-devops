name: CI/CD with Helm values

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq

    - name: Read Helm values
      id: helm-values
      run: |
        IMAGE_REPO=$(yq eval '.image.repository' devops/helm/nestjs/values.yaml)
        IMAGE_TAG=$(yq eval '.image.tag' devops/helm/nestjs/values.yaml)
        NODE_ENV=$(yq eval '.env.NODE_ENV' devops/helm/nestjs/values.yaml)

        echo "image_repo=$IMAGE_REPO" >> $GITHUB_OUTPUT
        echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "node_env=$NODE_ENV" >> $GITHUB_OUTPUT

    - name: Show parsed values
      run: |
        echo "📦 Image: ${{ steps.helm-values.outputs.image_repo }}:${{ steps.helm-values.outputs.image_tag }}"
        echo "🌱 Environment: ${{ steps.helm-values.outputs.node_env }}"
        
    - name: Build Docker image
      run: |
        docker build -t ${{ steps.helm-values.outputs.image_repo }}:${{ steps.helm-values.outputs.image_tag }} .

